<!-- Use the saved slug, or the package name when the slug is missing (e.g. Trio). -->
{% assign package_inquiry_fallback = package.name | slugify | replace: '-', '_' %}
{% assign package_inquiry = package.slug | default: package_inquiry_fallback %}
<div class="offer-item__container">
 <a href="{{site.baseurl}}/contact/?band_package={{package_inquiry}}" target="_blank" class="offer-item__img-link">
  <img src="{{ package.package_image.url }}" alt="{{ site.title }} - {{ package.name }}" title="{{ site.title }} - {{ package.name }}" class="offer-item__img">
  <div class="offer-item__title-container">
   <h4 class="offer-item__title">{{ package.name }}</h4>
  </div>
 </a>
 <p class="hex-dark">{{ package.description }}</p>

 <!-- Use the same PDF, external link, or inquiry button as the rates cards. -->
 <div class="offer-item__cta">
  {% include snippet/package-cta.html %}
 </div>
</div>
