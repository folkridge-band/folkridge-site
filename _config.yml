url: "https://folkridge.netlify.app" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Folk Ridge" # the name of your site, e.g. ACME Corp.


exclude: ["source", "node_modules", "mix-manifest.json", "package-lock.json", "package.json", "webpack.mix.js", ".jekyll-cache", "netlify.toml"]

plugins:
  - jekyll-feed
  - jekyll-strapi

strapi:
    # Original Strapi v3 API on Heroku (reference only; requires the v3 integration).
    # endpoint: https://strapi-folkridge.herokuapp.com

    # Local Strapi v5 API. Netlify uses the hosted URL in netlify.toml.
    enabled: true
    endpoint: http://127.0.0.1:1339/api
    collections:
        # Example for a "posts" collection
        posts:
            # Collection name (optional). Used to construct the url requested. Example: type `foo` would generate the following url `http://localhost:1337/foo`.
            type: posts
            # Permalink used to generate the output files (eg. /posts/:id).
            permalink: /posts/:slug/
        pages:
          type: pages

        bandmembers:
          type: bandmembers
        instruments:
          type: instruments
        packages:
          type: packages
        socials:
          type: socials
        contacts:
          type: contacts
        page-metas:
          type: page-metas



